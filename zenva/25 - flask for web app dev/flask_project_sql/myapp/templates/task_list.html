<!DOCTYPE html>
<html>
    <head>
        <title>Task List</title>
    </head>
    <body>
        <h1>Task List</h1>
        <a href="{{ url_for('task') }}"> Add New Task </a>
        <ul>
            {% for task in tasks %}
            <li>
                <strong>Title:</strong> {{ task.title }} <br>
                <strong>Description:</strong> {{ task.description }} <br>
                
                <form action ="{{ url_for('update_task_priority', task_id=task.id) }}" method="post">
                    <input type="number" name="priority" value="{{ task.priority }}" min="0" step="1" onchange="this.form.submit()">
                    <strong>Priority:</strong> <span> {{ task.priority }} </span><br>
                </form>

                <form action ="{{ url_for('update_task_status', task_id=task.id) }}" method="post">
                    <input type="checkbox" name="is_complete" value="1" {% if task.is_complete %}checked{% endif %} onchange = "this.form.submit()">
                    <strong> Completed:</strong> <span>{{ task.is_complete }}</span><br>
                </form>

                <form action = "{{ url_for('delete_task', task_id=task.id) }}" method="post">
                    <input type="submit" value="Delete" onclick="return confirm('are you sure ?');">

                </form>
            </li>
            {% else %}
            <li>No tasks available.</li>
            {% endfor %}
        </ul>
    </body>
</html>
