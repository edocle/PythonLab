<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ app_name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Orbitron:wght@500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <div>
          <h1>{{ app_name }}</h1>
          <p class="hint">Upload up to {{ max_files }} images, resize, preview, and download.</p>
        </div>
      </div>
    </header>

    <main class="container">
      <form method="post" enctype="multipart/form-data" class="card">
        <label>Images (PNG/JPG/JPEG, up to {{ max_files }})</label>
        <input type="file" name="images" accept=".png,.jpg,.jpeg" multiple required>

        <div class="row">
          <div>
            <label>Width</label>
            <input type="number" name="width" min="1" value="{{ form_values.width }}" required>
          </div>
          <div>
            <label>Height</label>
            <input type="number" name="height" min="1" value="{{ form_values.height }}" required>
          </div>
          <div>
            <label>Quality (1-95)</label>
            <input type="number" name="quality" min="1" max="95" value="{{ form_values.quality }}" required>
          </div>
        </div>

        <label class="checkline">
          <input type="checkbox" name="mirror" {% if form_values.mirror %}checked{% endif %}>
          Mirror output horizontally
        </label>

        <div class="card watermark-card">
          <label class="checkline">
            <input type="checkbox" name="watermark_enabled" {% if form_values.watermark_enabled %}checked{% endif %}>
            Enable text watermark
          </label>

          <label>Watermark Text</label>
          <input type="text" name="watermark_text" maxlength="80" value="{{ form_values.watermark_text }}" placeholder="edocle">

          <div class="row">
            <div>
              <label>Position</label>
              <select name="watermark_position">
                <option value="top-left" {% if form_values.watermark_position == "top-left" %}selected{% endif %}>Top Left</option>
                <option value="top-right" {% if form_values.watermark_position == "top-right" %}selected{% endif %}>Top Right</option>
                <option value="center" {% if form_values.watermark_position == "center" %}selected{% endif %}>Center</option>
                <option value="bottom-left" {% if form_values.watermark_position == "bottom-left" %}selected{% endif %}>Bottom Left</option>
                <option value="bottom-right" {% if form_values.watermark_position == "bottom-right" %}selected{% endif %}>Bottom Right</option>
              </select>
            </div>
            <div>
              <label>Opacity (0-100)</label>
              <input type="number" name="watermark_opacity" min="0" max="100" value="{{ form_values.watermark_opacity }}">
            </div>
            <div>
              <label>Font Size (0 = auto)</label>
              <input type="number" name="watermark_font_size" min="0" max="512" value="{{ form_values.watermark_font_size }}">
            </div>
          </div>

          <div class="row">
            <div>
              <label>Font Family</label>
              <select name="watermark_font_family">
                {% for font_name in watermark_font_choices %}
                  <option value="{{ font_name }}" {% if form_values.watermark_font_family == font_name %}selected{% endif %}>{{ font_name }}</option>
                {% endfor %}
              </select>
            </div>
            <div>
              <label>Text Color</label>
              <input type="color" name="watermark_color" value="{{ form_values.watermark_color }}">
            </div>
            <div>
              <label>Margin (px)</label>
              <input type="number" name="watermark_margin" min="0" max="500" value="{{ form_values.watermark_margin }}">
            </div>
          </div>

          <div class="row">
            <div>
              <label>Rotation</label>
              <input type="number" name="watermark_rotation" min="-360" max="360" value="{{ form_values.watermark_rotation }}">
            </div>
            <div>
              <label>Stroke Color</label>
              <input type="color" name="watermark_stroke_color" value="{{ form_values.watermark_stroke_color }}">
            </div>
            <div>
              <label>Stroke Width</label>
              <input type="number" name="watermark_stroke_width" min="0" max="32" value="{{ form_values.watermark_stroke_width }}">
            </div>
          </div>
        </div>

        <button type="submit">Resize Images</button>
      </form>

      {% if error %}
        <p class="error">{{ error }}</p>
      {% endif %}

      {% if results %}
        <section class="results">
          {% for item in results %}
            <article class="card result-item">
              <h3>{{ item.original_name }}</h3>
              <img src="{{ item.preview_url }}" alt="Preview of {{ item.original_name }}">
              <a href="{{ item.download_url }}">Download</a>
            </article>
          {% endfor %}
        </section>
      {% endif %}
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>Built with Flask + Pillow • {{ app_name }}</p>
      </div>
    </footer>
  </body>
</html>
